<svg class="surfay-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 523" role="img" aria-labelledby="surfay-art-title surfay-art-description">
  <title id="surfay-art-title">Surfay</title>
  <desc id="surfay-art-description">A left-facing surfer descending a steep teal wave beneath an orange sun, with a grainy print finish.</desc>
  <defs>
    <linearGradient id="surfay-paper" x2=".87" y2="1">
      <stop stop-color="#fdf7e9"/>
      <stop offset=".62" stop-color="#f4ebd8"/>
      <stop offset="1" stop-color="#e7cd96"/>
    </linearGradient>
    <radialGradient id="surfay-haze">
      <stop stop-color="#f2a03d" stop-opacity=".43"/>
      <stop offset="1" stop-color="#f2a03d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surfay-sun" x2=".3" y2="1">
      <stop stop-color="#f5b95d"/>
      <stop offset=".54" stop-color="#f2a03d"/>
      <stop offset="1" stop-color="#e05e2b"/>
    </linearGradient>
    <linearGradient id="surfay-sea" x2=".15" y2="1">
      <stop stop-color="#3f9c8c"/>
      <stop offset="1" stop-color="#175f59"/>
    </linearGradient>
    <filter id="surfay-paper-noise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .13  0 0 0 0 .095  0 0 0 0 .065  1.2 0 0 0 -.49"/>
    </filter>
    <pattern id="surfay-grain" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" filter="url(#surfay-paper-noise)"/>
    </pattern>
  </defs>

