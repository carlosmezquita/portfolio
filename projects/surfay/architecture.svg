<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Surfay architecture overview</title><desc id="desc">React + MapLibre connects to Worker API for forecast request; Open-Meteo connects to Worker API for marine weather; Spot profiles · D1 connects to TypeScript scoring for local context; Worker API connects to TypeScript scoring for forecast inputs; TypeScript scoring connects to Forecast snapshots for scored data; Forecast snapshots connects to React + MapLibre for served forecast</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><rect width="760" height="400" fill="#f8fafc"/><path d="M220 65 H280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 65 H480" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 275 H280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 100 V240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 275 H540" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 310 V365 H120 V100" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="30" width="200" height="70" rx="4" fill="#fff" stroke="#172033" stroke-width="2"/><text x="120" y="71" text-anchor="middle" fill="#172033" font-family="monospace" font-size="16">React + MapLibre</text><rect x="280" y="30" width="200" height="70" rx="4" fill="#facc15" stroke="#172033" stroke-width="2"/><text x="380" y="71" text-anchor="middle" fill="#172033" font-family="monospace" font-size="16">Worker API</text><rect x="540" y="30" width="200" height="70" rx="4" fill="#fff" stroke="#172033" stroke-width="2"/><text x="640" y="71" text-anchor="middle" fill="#172033" font-family="monospace" font-size="16">Open-Meteo</text><rect x="20" y="240" width="200" height="70" rx="4" fill="#fff" stroke="#172033" stroke-width="2"/><text x="120" y="281" text-anchor="middle" fill="#172033" font-family="monospace" font-size="16">Spot profiles · D1</text><rect x="280" y="240" width="200" height="70" rx="4" fill="#fff" stroke="#172033" stroke-width="2"/><text x="380" y="281" text-anchor="middle" fill="#172033" font-family="monospace" font-size="16">TypeScript scoring</text><rect x="540" y="240" width="200" height="70" rx="4" fill="#fff" stroke="#172033" stroke-width="2"/><text x="640" y="281" text-anchor="middle" fill="#172033" font-family="monospace" font-size="16">Forecast snapshots</text><text x="22" y="389" fill="#475569" font-family="monospace" font-size="13">High-level component relationships</text></svg>